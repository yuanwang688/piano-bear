<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Piano Bear</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one screen, bear center stage, piano-key energy bar below, one big action button. Single bright look by choice. */
:root{
  --sky:#dff1fb; --sky2:#c4e6f7; --ink:#2b2340; --honey:#b5753c; --honey-dk:#8a5427;
  --muzzle:#f1d3a8; --key:#ffffff; --key-edge:#9db8c9; --lit:#ffb627; --lit2:#ff7a59;
  --card:#ffffffcc; --tv:#5b4bd6; --ok:#2fa36b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;overflow-x:hidden}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:14px 24px;position:relative}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:.5px}
.gear{font:600 .8rem var(--body);background:var(--card);border:2px solid var(--key-edge);border-radius:999px;padding:8px 12px;color:var(--ink);position:relative;overflow:hidden;cursor:pointer;touch-action:none}
.gear .fill{position:absolute;inset:0;background:var(--sky2);transform-origin:left;transform:scaleX(0)}
.gear span{position:relative}
.nametag{font-family:var(--display);font-weight:800;font-size:1.15rem;color:#fff;background:var(--honey);border:3px solid var(--honey-dk);border-radius:999px;padding:2px 16px;margin-top:-18px;box-shadow:0 3px 0 #00000020;position:relative;z-index:1}
.status{font:700 1rem var(--body);min-height:1.4em;text-align:center}

.stage{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%}
.stage svg{width:100%;height:100%;overflow:visible}
.note{position:absolute;font-size:2rem;color:var(--tv);opacity:0;pointer-events:none;font-family:serif}
.dancing .note{animation:float 2.2s ease-out infinite}
.dancing .note:nth-child(2){animation-delay:.7s;left:78%}
.dancing .note:nth-child(3){animation-delay:1.4s;left:8%;color:var(--lit2)}
.note{left:14%;top:40%}
@keyframes float{0%{opacity:0;transform:translateY(0) rotate(-10deg)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) rotate(15deg)}}

#bear{transform-origin:150px 270px}
.dancing #bear{animation:bop .5s ease-in-out infinite alternate}
.dancing #armL{animation:waveL .5s ease-in-out infinite alternate}
.dancing #armR{animation:waveR .5s ease-in-out infinite alternate}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.spark:nth-of-type(3n+2){animation-delay:.5s}.spark:nth-of-type(3n){animation-delay:1s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
#wingL{transform-origin:146px 180px;animation:flutterL 2.4s ease-in-out infinite}
#wingR .wingInner{transform-origin:146px 180px;animation:flutterL 2.4s ease-in-out infinite}
.dancing #wingL,.dancing #wingR .wingInner{animation-duration:.35s}
@keyframes flutterL{0%,100%{transform:rotate(0deg) scaleX(1)}50%{transform:rotate(6deg) scaleX(.88)}}
#armL{transform-origin:95px 175px}#armR{transform-origin:205px 175px}
@keyframes bop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes waveL{from{transform:rotate(20deg)}to{transform:rotate(-55deg)}}
@keyframes waveR{from{transform:rotate(-20deg)}to{transform:rotate(55deg)}}
.sleepy #eyes{display:none}.sleepy #eyesClosed{display:inline}
#eyesClosed{display:none}

.bar{width:100%;display:flex;flex-direction:column;gap:8px}
.battery{display:flex;align-items:center;width:100%}
.cell{flex:1;height:76px;border:6px solid var(--ink);border-radius:18px;background:var(--key);padding:5px;position:relative}
.nub{width:14px;height:32px;background:var(--ink);border-radius:0 8px 8px 0}
.juice{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#ff7a59,#ffb627 45%,#5fd38d);background-size:calc(100vw) 100%;transition:width .6s ease;position:relative;overflow:hidden;min-width:0}
.charging .juice::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,#ffffff55 0 14px,transparent 14px 28px);background-size:40px 100%;animation:stripes .8s linear infinite}
@keyframes stripes{to{background-position:40px 0}}
.bolt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;font:800 1.6rem var(--display);color:var(--ink);font-variant-numeric:tabular-nums;pointer-events:none}
.bolt svg{width:26px;height:34px;opacity:.25;transition:opacity .3s}
.charging .bolt svg{opacity:1;animation:zap .6s ease-in-out infinite alternate}
@keyframes zap{to{transform:scale(1.2)}}
.full .cell{border-color:var(--ok)}.full .nub{background:var(--ok)}
.barlabel{display:flex;justify-content:space-between;font:700 .95rem var(--body);font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.controls .soft{font-size:1rem;min-width:0}
.soft:disabled{opacity:.45;cursor:default}
.soft.tv{background:var(--tv);color:#fff;border-color:var(--tv)}
.soft.warn{background:var(--lit2);color:#fff;border-color:var(--lit2)}

.big{font-family:var(--display);font-weight:800;font-size:1.6rem;border:none;border-radius:999px;padding:14px 30px;color:#fff;cursor:pointer;box-shadow:0 6px 0 #00000030;transition:transform .1s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #00000030}
.big:focus-visible,.gear:focus-visible,button:focus-visible{outline:3px solid var(--tv);outline-offset:3px}
.start{background:var(--ok)}
.redeem{background:var(--tv);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

.tvscreen{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tvbox{background:var(--tv);color:#fff;border-radius:28px;padding:22px 28px;border:8px solid var(--ink);width:min(340px,100%)}
.count{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.soft{font:700 1rem var(--body);background:var(--card);border:2px solid var(--key-edge);border-radius:999px;padding:10px 18px;color:var(--ink);cursor:pointer}

.panel{position:fixed;inset:0;background:#2b234088;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{background:#fff;color:var(--ink);border-radius:20px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--display);margin:0;font-size:1.4rem}
.sheet label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.sheet small{font-weight:500;opacity:.75}
.sheet input[type=number]{font:700 1.1rem var(--body);padding:8px;border-radius:10px;border:2px solid var(--key-edge);width:100px}
.meter{height:12px;background:var(--sky);border-radius:6px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);width:0}
.meter b{position:absolute;top:0;bottom:0;width:3px;background:var(--lit2)}
.note-box{background:#fff3d6;border-radius:12px;padding:10px 12px;font-size:.9rem}
.seg{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.seg legend{font-weight:700;padding:0;margin-bottom:6px}
.seg{flex-direction:row;flex-wrap:wrap}
.seg label{flex:1 1 0;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:10px 8px;border:2px solid var(--key-edge);border-radius:12px;font-weight:700;cursor:pointer}
.seg input:checked+span{background:var(--tv);color:#fff;border-color:var(--tv)}
.seg input:focus-visible+span{outline:3px solid var(--tv);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dancing #bear,.dancing #armL,.dancing #armR,.redeem,.dancing .note,.spark,#wingL,#wingR .wingInner{animation-duration:2s!important}}
</style>

          <circle cx="112" cy="122" r="8" fill="#f29a8e" opacity=".6"/><circle cx="188" cy="122" r="8" fill="#f29a8e" opacity=".6"/>
          <g id="bowtie" transform="translate(186 64) rotate(25) scale(.72) translate(-150 -176)">
            <path d="M150 176 L112 156 Q104 176 112 196 Z" fill="#e2445c" stroke="#a82640" stroke-width="3" stroke-linejoin="round"/>
            <path d="M150 176 L188 156 Q196 176 188 196 Z" fill="#e2445c" stroke="#a82640" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="122" cy="168" r="3.5" fill="#fff" opacity=".85"/><circle cx="121" cy="184" r="3.5" fill="#fff" opacity=".85"/>
            <circle cx="178" cy="168" r="3.5" fill="#fff" opacity=".85"/><circle cx="179" cy="184" r="3.5" fill="#fff" opacity=".85"/>
            <rect x="140" y="165" width="20" height="22" rx="6" fill="#c8334c" stroke="#a82640" stroke-width="3"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="nametag">Honey Bear</div>
    <div class="status" id="status">Honey Bear is sleepy. Play some piano to wake her up!</div>
    <div class="bar" id="bar">
      <div class="battery" role="progressbar" aria-label="TV time charged" id="battery">
        <div class="cell"><div class="juice" id="juice"></div>
          <div class="bolt"><svg viewBox="0 0 24 32"><path d="M14 0 2 18h8l-2 14 14-20h-8z" fill="var(--ink)"/></svg><span id="pct">0%</span></div>
        </div>
        <div class="nub"></div>
      </div>
      <div class="barlabel"><span id="played">0:00 played</span><span id="goalLbl">Goal 15 min</span></div>
    </div>
    <button class="big start" id="startBtn">Ready to play!</button>
    <div class="controls">
      <button class="soft" id="gear">Settings</button>
      <button class="soft" id="resetMain">Reset</button>
      <button class="soft" id="manualBtn">Start timer</button>
      <button class="soft tv" id="redeemBtn">Redeem for TV</button>
    </div>
  </div>

  <div class="tvscreen" id="tv" hidden>
    <div class="tvbox">
      <div>TV time left</div>
      <div class="count" id="count">15:00</div>
    </div>
    <div class="status" id="tvStatus">Enjoy your show! You earned it.</div>
    <div class="row">
      <button class="soft" id="pauseBtn">Pause</button>
      <button class="soft" id="stopBtn">Stop TV time</button>
    </div>
    <button class="big start" id="doneBtn" hidden>OK, all done!</button>
  </div>
</div>

<div class="panel" id="panel" hidden>
  <div class="sheet" role="dialog" aria-label="Grown-up settings">
    <h2>Grown-up settings</h2>
    <label>Practice goal (minutes)
      <input type="number" id="goalIn" min="1" max="120" value="15">
    </label>
    <label>How strict Honey Bear is
      <input type="range" id="sensIn" min="1" max="10" value="5">
      <small>Lower = counts quiet or far-away playing. Higher = ignores more talking and noise. While she plays, the green bar should cross the orange line; when people talk, it should stay under.</small>
      <div class="meter"><i id="meterFill"></i><b id="meterLine"></b></div>
      <small id="hear" style="font-variant-numeric:tabular-nums">Tap Ready to play! to start listening.</small>
    </label>
    <fieldset class="seg">
      <legend>How Honey Bear listens</legend>
      <label><input type="radio" name="detector" value="smart" id="detSmart"><span>Sound model</span></label>
      <label><input type="radio" name="detector" value="simple" id="detSimple"><span>Simple rule</span></label>
    </fieldset>
    <div class="note-box" id="modeNote">Loading the sound model…</div>
    <div class="note-box" id="micNote" hidden></div>
    <div class="row" style="justify-content:space-between">
      <button class="soft" id="addBtn">+1 minute</button>
      <button class="big start" id="closeBtn" style="font-size:1.1rem;padding:10px 22px">Done</button>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('pb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('pb_'+k,JSON.stringify(v))}catch(e){}}};

let goal=store.get('goal',15), strict=store.get('strict',5), earned=store.get('earned',0), manualOn=false;
let ctx=null, analyser=null, td=null, fd=null, listening=false, lastHit=-1e9, lastTick=0, level=0;
let tvEnd=0, tvPausedLeft=null, tvTimer=null, alarmStop=null, wake=null;

/* ---------- energy bar ---------- */
function buildKeys(){ $('goalLbl').textContent='Goal '+goal+' min'; }
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){
  const frac=Math.min(1,earned/(goal*60)), pct=Math.floor(frac*100);
  $('juice').style.width=(frac*100)+'%';
  $('pct').textContent=pct+'%';
  $('battery').setAttribute('aria-valuenow',pct);
  $('played').textContent=fmt(earned)+' played';
  const full=earned>=goal*60;
  $('bar').classList.toggle('full',full);
  $('redeemBtn').disabled=earned<60;
  $('redeemBtn').classList.toggle('redeem',full);
  $('redeemBtn').textContent=earned<60?'Redeem for TV':'TV: '+Math.floor(earned/60)+' min';
  $('startBtn').hidden=listening;
  $('manualBtn').textContent=manualOn?'Stop timer':'Start timer';
  $('manualBtn').classList.toggle('warn',manualOn);
}

/* ---------- smart listening: YAMNet sound classifier (MediaPipe) ---------- */
const PIANO=['Piano','Keyboard (musical)','Electric piano','Harpsichord','Synthesizer'];
const MUSIC=['Music','Musical instrument','Glockenspiel','Marimba, xylophone','Vibraphone','Tubular bells','Bell','Chime','Tuning fork'];
const SPEECH=['Speech','Child speech, kid speaking','Conversation','Narration, monologue','Babbling'];
let detector=store.get('detector','smart');        // the grown-up's choice: 'smart' | 'simple'
let classifier=null, modelState='idle';            // 'idle' | 'loading' | 'ready' | 'failed'
let scores={piano:0,music:0,speech:0}, hits=[], micSrc=null, smartWired=false;
let modelPromise=null, checks=0;
function loadModel(){
  if(modelPromise) return modelPromise;
  modelState='loading'; updateModeNote();
  modelPromise=(async()=>{
    try{
      const base=new URL('vendor/mediapipe/',location.href).href;
      const {FilesetResolver,AudioClassifier}=await import(base+'audio_bundle.mjs');
      const files=await FilesetResolver.forAudioTasks(base+'wasm');
      classifier=await AudioClassifier.createFromOptions(files,{
        baseOptions:{modelAssetPath:new URL('vendor/yamnet.tflite',location.href).href},
        categoryAllowlist:[...PIANO,...MUSIC,...SPEECH], maxResults:-1});
      modelState='ready';
      if(micSrc) wireSmart();
    }catch(e){ console.warn('Sound model unavailable',e); modelState='failed'; modelPromise=null; }
    updateModeNote();
  })();
  return modelPromise;
}
function useSmart(){ return detector==='smart' && modelState==='ready'; }
function updateModeNote(){
  document.querySelectorAll('[name=detector]').forEach(r=>r.checked=(r.value===detector));
  $('modeNote').textContent = detector==='simple' ? 'Simple rule: Honey Bear listens for loud, clear notes. Fast, but talking can sometimes count.'
    : modelState==='ready' ? 'Sound model: Honey Bear tells piano from talking. Reacts about a second after she starts.'
    : modelState==='failed' ? 'The sound model could not load, so Honey Bear is using the simple rule for now. Reload on good Wi-Fi to try again.'
    : 'Loading the sound model… Honey Bear uses the simple rule until it is ready.';
}
// Tuned on real clips (test-clips/): her piano scores 0.6-0.99, talking stays under 0.08.
function threshold(){ return 0.05+strict*0.03; }   // strictness 1..10 -> 0.08..0.35 (default 0.20)
function judge(sc){
  const inst=Math.max(sc.piano, sc.music);
  return inst>=threshold() && !(sc.speech>0.6 && sc.speech>inst*3);
}
function classifyChunk(chunk,rate){
  // Quiet or far-away playing scores low, so boost each window toward a normal level (max 16x).
  let peak=0; for(let i=0;i<chunk.length;i++){const v=Math.abs(chunk[i]); if(v>peak)peak=v;}
  if(peak<0.003){ scores={piano:0,music:0,speech:0}; pushHit(false); return; }   // silence
  const g=Math.min(16,0.5/peak); if(g>1) for(let i=0;i<chunk.length;i++) chunk[i]*=g;
  let res; try{ res=classifier.classify(chunk,rate); }catch(e){ return; }
  const sc={piano:0,music:0,speech:0};
  for(const r of res){ for(const c of (r.classifications[0]||{categories:[]}).categories){
    const k=PIANO.includes(c.categoryName)?'piano':MUSIC.includes(c.categoryName)?'music':SPEECH.includes(c.categoryName)?'speech':null;
    if(k && c.score>sc[k]) sc[k]=c.score;
  }}
  scores=sc; checks++; if(window.pbDebug) window.pbDebug.push([Math.round(performance.now()),sc]);
  pushHit(judge(sc));
}
function pushHit(h){
  hits.push(h); if(hits.length>4) hits.shift();
  if(h && hits.filter(Boolean).length>=2) lastHit=performance.now();   // 2 of the last 4 windows (~2 s)
}
function wireSmart(){
  if(smartWired||!micSrc) return; smartWired=true;
  const rate=ctx.sampleRate, win=Math.round(rate*1.0), hop=Math.round(rate*0.5);
  const buf=new Float32Array(win); let filled=0, sinceHop=0;
  const sp=ctx.createScriptProcessor(4096,1,1), mute=ctx.createGain(); mute.gain.value=0;
  sp.onaudioprocess=e=>{
    if(!useSmart() || (!listening && $('panel').hidden)) return;
    const x=e.inputBuffer.getChannelData(0), n=x.length;
    if(n>=win){ buf.set(x.subarray(n-win)); filled=win; }
    else { buf.copyWithin(0,n); buf.set(x,win-n); filled=Math.min(win,filled+n); }
    sinceHop+=n;
    if(filled===win && sinceHop>=hop){ sinceHop=0; const chunk=buf.slice(); setTimeout(()=>classifyChunk(chunk,rate),0); }
  };
  micSrc.connect(sp); sp.connect(mute); mute.connect(ctx.destination);
}

/* ---------- simple rule: loud + clear pitch ---------- */
function hearsPiano(){
  if(!analyser) return false;
  analyser.getFloatTimeDomainData(td);
  let s=0; for(let i=0;i<td.length;i++) s+=td[i]*td[i];
  const rms=Math.sqrt(s/td.length);
  level=Math.min(1,rms*12);
  const sens=11-strict, thresh=0.11-sens*0.01;
  if(level<thresh*12*0.5) return false;
  analyser.getFloatFrequencyData(fd);
  const hz=ctx.sampleRate/analyser.fftSize, lo=Math.floor(50/hz), hi=Math.floor(4200/hz);
  let max=-Infinity, sum=0;
  for(let i=lo;i<hi;i++){const v=fd[i]; if(v>max)max=v; sum+=v}
  return (max-sum/(hi-lo))>28;
}

let micOn=false;
async function startMic(){
  if(micOn) return true;
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') await ctx.resume();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    micSrc=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=0.3;
    micSrc.connect(analyser);
    td=new Float32Array(analyser.fftSize); fd=new Float32Array(analyser.frequencyBinCount);
    if(detector==='smart'){ loadModel(); if(modelState==='ready') wireSmart(); }
    micOn=true; return true;
  }catch(e){
    $('micNote').hidden=false;
    $('micNote').textContent="The microphone isn't available here. Allow microphone access in the browser, or use Start timer while she plays.";
    return false;
  }
}

function loop(){
  const now=performance.now(), dt=lastTick?(now-lastTick)/1000:0; lastTick=now;
  const smart=useSmart();
  if(!smart && analyser){ if(hearsPiano() && listening) lastHit=now; }
  else if(analyser){ analyser.getFloatTimeDomainData(td); let s=0; for(let i=0;i<td.length;i+=4) s+=td[i]*td[i]; level=Math.min(1,Math.sqrt(s/(td.length/4))*12); }
  const grace=smart?2500:1600;   // her pauses between phrases are under 2 s
  const active=listening||manualOn;
  if(active){
    const playing=manualOn || now-lastHit<grace;
    $('stage').classList.toggle('dancing',playing);
    $('stage').classList.toggle('sleepy',!playing);
    $('bar').classList.toggle('charging',playing);
    if(playing && dt<1){ earned+=dt; }
    $('status').textContent=manualOn?'Practice timer is on. Keep playing!'
      : playing?(earned>=goal*60?'Wow! Extra minutes for even more TV!':'Honey Bear is dancing! Keep playing!')
      : 'Honey Bear is waiting for music…';
    if(Math.floor(earned)!==Math.floor(earned-dt)) store.set('earned',earned);
    render();
  }
  if(!$('panel').hidden){
    if(smart){
      const inst=Math.max(scores.piano,scores.music);
      $('meterFill').style.width=Math.min(100,inst*100)+'%';
      $('meterLine').style.left=Math.min(97,threshold()*100)+'%';
      $('hear').textContent='Piano '+Math.round(scores.piano*100)+'% · Music '+Math.round(scores.music*100)+'% · Talking '+Math.round(scores.speech*100)+'% · '+checks+' checks';
    }else{
      const sens=11-strict;
      $('meterFill').style.width=(level*100)+'%';
      $('meterLine').style.left=Math.min(97,(0.11-sens*0.01)*600)+'%';
      $('hear').textContent=analyser?'Loudness '+Math.round(level*100)+'%':'Tap Ready to play! to start listening.';
    }
  }
  requestAnimationFrame(loop);
}
$('startBtn').onclick=async()=>{
  const ok=await startMic();
  if(!ok){ openPanel(); return; }
  listening=true; lastTick=0; render(); keepAwake();
  $('status').textContent='Honey Bear is listening… play something!';
};
$('manualBtn').onclick=()=>{
  manualOn=!manualOn; lastTick=0;
  if(!manualOn && !listening){
    $('stage').classList.remove('dancing'); $('stage').classList.add('sleepy'); $('bar').classList.remove('charging');
    $('status').textContent='Honey Bear is sleepy. Play some piano to wake her up!';
  }
  if(manualOn) keepAwake();
  store.set('earned',earned); render();
};

/* ---------- TV countdown ---------- */
$('redeemBtn').onclick=()=>{
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  ctx.resume();
  const secs=Math.round(earned);
  earned=0; store.set('earned',0); listening=false; manualOn=false; $('bar').classList.remove('charging');
  tvEnd=Date.now()+secs*1000; tvPausedLeft=null; store.set('tvEnd',tvEnd);
  showTV(); keepAwake();
};
function showTV(){
  $('practice').style.display='none'; $('tv').hidden=false;
  $('doneBtn').hidden=true; $('pauseBtn').textContent='Pause'; $('pauseBtn').parentElement.hidden=false;
  $('tvStatus').textContent='Enjoy your show! You earned it.';
  clearInterval(tvTimer); tvTimer=setInterval(tickTV,250); tickTV();
}
function tickTV(){
  const left=tvPausedLeft!=null?tvPausedLeft:(tvEnd-Date.now())/1000;
  $('count').textContent=fmt(Math.ceil(left));
  if(left<=0 && tvPausedLeft==null){
    clearInterval(tvTimer); store.set('tvEnd',0);
    $('count').textContent='0:00';
    $('tvStatus').textContent='TV time is all done. Great job today!';
    $('pauseBtn').parentElement.hidden=true; $('doneBtn').hidden=false;
    playAlarm();
  }
}
$('pauseBtn').onclick=()=>{
  if(tvPausedLeft==null){tvPausedLeft=(tvEnd-Date.now())/1000;$('pauseBtn').textContent='Resume';$('tvStatus').textContent='Paused';}
  else{tvEnd=Date.now()+tvPausedLeft*1000;tvPausedLeft=null;store.set('tvEnd',tvEnd);$('pauseBtn').textContent='Pause';$('tvStatus').textContent='Enjoy your show!';}
};
$('stopBtn').onclick=()=>{clearInterval(tvTimer);store.set('tvEnd',0);backToPractice()};
$('doneBtn').onclick=()=>{if(alarmStop)alarmStop();backToPractice()};
function backToPractice(){
  $('tv').hidden=true; $('practice').style.display='contents';
  $('stage').classList.remove('dancing'); $('stage').classList.add('sleepy');
  $('status').textContent='Honey Bear is sleepy. Play some piano to wake her up!';
  render();
}

/* gentle music-box chime, repeats softly for ~30s or until OK */
function playAlarm(){
  if(!ctx) return; ctx.resume();
  const notes=[523.25,659.25,783.99,1046.5,783.99,659.25];
  let stopped=false, rounds=0;
  const round=()=>{
    if(stopped||rounds++>6) return;
    const t0=ctx.currentTime;
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), t=t0+i*0.35;
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0008,t+1.2);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+1.3);
    });
    setTimeout(round,4500);
  };
  round();
  alarmStop=()=>{stopped=true};
}
async function keepAwake(){try{wake=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(listening||!$('tv').hidden))keepAwake()});

/* ---------- settings + reset ---------- */
$('gear').onclick=()=>openPanel();
let resetArm=null;
$('resetMain').onclick=()=>{
  const b=$('resetMain');
  if(!resetArm){
    b.textContent='Tap again to reset'; b.classList.add('warn');
    resetArm=setTimeout(()=>{resetArm=null;b.textContent='Reset';b.classList.remove('warn')},3000);
    return;
  }
  clearTimeout(resetArm); resetArm=null; b.textContent='Reset'; b.classList.remove('warn');
  earned=0; store.set('earned',0); render();
  $('status').textContent=listening?'Battery is empty. Play to charge it up!':'Honey Bear is sleepy. Play some piano to wake her up!';
};
async function openPanel(){
  $('panel').hidden=false;
  $('goalIn').value=goal; $('sensIn').value=strict; updateModeNote();
  if(!analyser) await startMic();
}
$('closeBtn').onclick=()=>{
  goal=Math.max(1,Math.min(120,parseInt($('goalIn').value)||15)); store.set('goal',goal);
  strict=+$('sensIn').value; store.set('strict',strict);
  $('panel').hidden=true; buildKeys(); render();
};
$('sensIn').oninput=e=>{strict=+e.target.value};
document.querySelectorAll('[name=detector]').forEach(r=>r.onchange=()=>{
  detector=r.value; store.set('detector',detector); hits=[]; lastHit=-1e9;
  if(detector==='smart'){ loadModel(); if(modelState==='ready') wireSmart(); }
  updateModeNote();
});
if(detector==='smart') loadModel(); else updateModeNote();
$('addBtn').onclick=()=>{earned+=60;store.set('earned',earned);render()};

/* resume an unfinished TV countdown after a reload */
buildKeys(); render();
const savedEnd=store.get('tvEnd',0);
if(savedEnd>Date.now()){tvEnd=savedEnd;showTV()}
requestAnimationFrame(loop);
})();
</script>

</body>
</html>
